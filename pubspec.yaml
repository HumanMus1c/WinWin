name: winwin
description: "WinWin — BiliPai Windows port (Flutter Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.7.0
  http2: ^2.3.1
  collection: ^1.18.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  cookie_jar: ^4.0.8
  # 官方 Cupertino 独立包：SDK 内设计库已在 Flutter 3.44 冻结，
  # 并在后续 stable 排期正式弃用（AppIcons 的 CupertinoIcons 依赖此包）。
  # 锁定 1.0.0 = 与 SDK 3.47 冻结代码等价的零行为变化替换；升级 1.x 单独评估。
  cupertino_ui: 1.0.0
  cached_network_image_ce: ^4.1.1
  fvp: ^0.38.1
  protobuf: ^6.0.0
  # Phase 8: 极验验证码 WebView（用于短信/密码登录风控）
  # ≥6.2.0-beta.3 已修复 MSVC 14.51 coroutine 兼容性（WebView2 1.0.3650.58 / CppWinRT 2.0.250303.1）
  flutter_inappwebview: ^6.2.0-beta.3
  fixnum: ^1.1.1
  # Phase 4.6: 桌面伪 PiP（窗口缩放 + 置顶）
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  # Phase 3: 直播弹幕二进制 WebSocket（16 字节头 + auth/heartbeat + zlib/brotli 递归解压）
  web_socket_channel: ^3.0.3
  # Phase 3: 直播弹幕 brotli 解压（服务端可能用 brotli 而非 zlib 压缩 payload）
  brotli: ^0.6.0
  # 日志系统：结构化日志输出（logger）+ 崩溃捕获与 Report 落盘（catcher_2）。
  # 混合方案：PiliPlus 骨架（同栈可复用）+ BiliPai 增强（内存缓冲/普通日志落盘/脱敏）。
  logger: ^2.5.0
  catcher_2: ^2.1.9
  # 字体导入：桌面端文件选择器，用于导入 .ttf/.otf 自定义字体文件。
  file_picker: ^12.2.0
  # 官方 Material 独立包：SDK 内的 package:flutter/material.dart 已冻结，
  # 新特性（M3 Expressive 等）只在此包迭代。全库导入已迁至 material_ui。
  # 1.5.0 = 迁移后评估升级：1.1.0→1.5.0 无破坏性变更；Expressive 为显式
  # opt-in（默认仍 StyleVariant.material3）；兼容桥接仍存留（见 main.dart）。
  material_ui: 1.5.0
  # 动态页多列瀑布流排版：解决异质卡片在标准网格中的行间留白浪费问题。
  flutter_staggered_grid_view: ^0.7.0
  # Miuix 风格运行时实现：ChuxinNeko/flutter_miuix（miuix 的 Flutter 1:1 移植，
  # 45+ 组件 / squircle 圆角 / folme 弹簧 / 玻璃材质，支持 Windows）。
  # 社区年轻库：精确锁定 1.3.0，仅 miuix 渲染路径引用，可整体回退；
  # 阶段1 复盘见 docs/flutter_miuix阶段1-桥接与试点复盘-2026-10-02.md。
  flutter_miuix: 1.3.0

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 沉浸式标题栏程序图标（与 windows/runner/resources/app_icon.ico 同源，
    # 替换品牌图标时需同步更新两处）。
    - assets/app_icon.png
