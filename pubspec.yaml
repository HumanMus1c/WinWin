name: winwin
description: "WinWin — BiliPai Windows port (Flutter Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.7.0
  http2: ^2.3.1
  collection: ^1.18.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  cookie_jar: ^4.0.8
  cached_network_image: ^3.4.1
  fvp: ^0.37.3
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  # Phase 4.6: 桌面伪 PiP（窗口缩放 + 置顶）
  window_manager: ^0.4.3
  # Phase 3: 直播弹幕二进制 WebSocket（16 字节头 + auth/heartbeat + zlib/brotli 递归解压）
  web_socket_channel: ^3.0.3
  # Phase 3: 直播弹幕 brotli 解压（服务端可能用 brotli 而非 zlib 压缩 payload）
  brotli: ^0.6.0
  # 日志系统：结构化日志输出（logger）+ 崩溃捕获与 Report 落盘（catcher_2）。
  # 混合方案：PiliPlus 骨架（同栈可复用）+ BiliPai 增强（内存缓冲/普通日志落盘/脱敏）。
  logger: ^2.5.0
  catcher_2: ^2.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
